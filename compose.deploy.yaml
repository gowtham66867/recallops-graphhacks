# Run together with compose.yaml; persistent data stays in recallops-graph.
services:
  graph:
    restart: unless-stopped
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RECALLOPS_PORT:-8080}:8000"
    environment:
      FALKORDB_HOST: graph
      FALKORDB_PORT: "6379"
      FALKORDB_GRAPH: recallops
      GEMINI_API_KEY: ${RECALLOPS_GEMINI_API_KEY:-}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL:-gemini-3.8-flash}
      GEMINI_SPEECH_MODEL: ${GEMINI_SPEECH_MODEL:-gemini-3.8-flash-lite-tts}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      # Empty by default. Supply a funded, rotated key through the host environment.
      OPENAI_API_KEY: ${RECALLOPS_OPENAI_API_KEY:-}
    depends_on:
      graph:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
