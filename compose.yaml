services:
  graph:
    image: falkordb/falkordb:v4.16.3
    ports:
      - "127.0.0.1:6389:6379"
    volumes:
      - recallops-graph:/var/lib/falkordb/data
    command: ["--dir", "/var/lib/falkordb/data", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  recallops-graph:
